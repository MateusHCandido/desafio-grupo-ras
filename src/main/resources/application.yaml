spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tarifa_agua
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ras

    show-sql: true